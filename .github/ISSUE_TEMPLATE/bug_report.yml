name: Bug report
description: Something broken in SnipeBot
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, command used, Node version, Docker or direct Node.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log lines with ids only. Never paste message content or tokens.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first
          required: true
        - label: No secrets or message content included
          required: true
